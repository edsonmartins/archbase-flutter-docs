name: Deploy to GitHub Pages

# Build em todo push para main + permite trigger manual.
# Deploy só acontece quando o workflow rodou no branch main.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas pro deploy ao Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita corridas — só um deploy ao vivo por vez.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # showLastUpdateAuthor precisa do git history

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
